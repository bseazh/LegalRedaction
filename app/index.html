<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LegalRedaction</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f5f6f8;color:#18212f}header{background:#18212f;color:white;padding:16px 24px}main{display:grid;grid-template-columns:1fr 360px;gap:16px;padding:16px}.card{background:white;border:1px solid #dfe3e8;border-radius:9px;padding:16px}.text{white-space:pre-wrap;line-height:1.8;max-height:70vh;overflow:auto}.entity{padding:10px;border:1px solid #dfe3e8;border-radius:7px;margin:8px 0}.entity.ok{border-left:4px solid #18864b;background:#f2fbf5}.entity.no{border-left:4px solid #a75b00;background:#fffaf0}button{padding:7px 10px;border-radius:5px;border:1px solid #bbc4d0;background:#fff;margin:3px;cursor:pointer}.primary{background:#1769d2;color:#fff;border-color:#1769d2}#status{color:#536071;font-size:13px}</style></head><body><header><b>LegalRedaction</b><span id="status"> 本地服务未连接</span></header><main><section class="card"><h2>导入文件</h2><input id="file" type="file" accept=".txt,.md,.eml,.docx,.pdf"><p id="fileName"></p><hr><div id="content" class="text">选择 TXT、DOCX 或有文本层的 PDF 后开始识别。</div></section><aside class="card"><h2>候选实体</h2><div id="entities"></div><button class="primary" onclick="exportRedacted()">导出脱敏文本</button></aside></main><script type="module" src="/src/main.js"></script></body></html>
